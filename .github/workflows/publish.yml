# Publishes llms-ink to PyPI on a version tag (v0.3.0), with PyPI trusted publishing (OIDC) and attestations.
# This folder is mirrored from the private llms.ink repo by scripts/mirror.mjs; edit it there.
name: Publish

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

jobs:
  guard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[guard]' pytest
      - run: llms-ink-guard setup
      - name: Prepare pinned offline container fixture
        run: |
          fixture_image=python@sha256:48d884813cf44e927cf64c5529dd630dd3b18338c6dc727991eef9b71e934a20
          docker pull --platform linux/amd64 "$fixture_image"
          echo "LLMS_INK_CONTAINER_IMAGE=$(docker image inspect "$fixture_image" --format '{{.Id}}')" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        if: matrix.python-version == '3.13'
        with:
          go-version: '1.26.11'
          cache-dependency-path: tests/interop/modern-go/go.sum
      - run: pytest tests/test_guard.py tests/test_guard_policy.py tests/test_guard_approval.py tests/test_guard_gateway.py tests/test_guard_modern.py tests/test_guard_service.py tests/test_guard_review.py tests/test_guard_onboarding.py tests/test_guard_container.py
        env:
          LLMS_INK_GUARD_MODEL_TEST: '1'
          LLMS_INK_GUARD_CONTAINER_TEST: '1'
          LLMS_INK_CONTAINER_CONTEXT: default
          LLMS_INK_GUARD_GO_TEST: ${{ matrix.python-version == '3.13' && '1' || '0' }}
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: guard
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Tag matches the package version
        run: test "v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/llms_ink/__init__.py)" = "$GITHUB_REF_NAME"
      - run: pip install build pytest
      - run: pip install -e '.[langchain,llama-index]'
      - run: pytest
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
